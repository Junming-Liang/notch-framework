name: Validate development slice
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core-and-host:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Swift version
        run: swift --version
      - name: Unit and IPC tests
        run: swift test
      - name: Build development app
        run: bash Tools/build-app.sh
      - name: Real loopback network install and IPC smoke
        run: bash Tools/verify-network-ci.sh
      - name: Archive safety tests
        run: python3 -m unittest discover -s Tools -p 'test_*.py' -v
      - name: No publication
        run: echo 'This workflow does not publish releases, create credentials, or notarize.'
